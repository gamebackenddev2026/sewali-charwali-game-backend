<!DOCTYPE html>
<html>
    <head>
        <title>Sewali Charwali</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style type="text/css">
            table {
                border: 0px;
            }
        </style>
    </head>

    <body style="margin: 0px; padding: 0px">
        <table cellspacing="0" cellpadding="0" width="600" align="center" bgcolor="#fff">
            <tr>
                <td height="5"></td>
            </tr>
            <tr>
                <td>
                    <div style="overflow: hidden; display: inline-block">
                        <table cellspacing="0" cellpadding="0" width="100%" align="center" style="text-align: left">
                            <tr>
                                <td bgcolor="#ffffff">
                                    <table cellspacing="0" cellpadding="0" width="100%" align="center">
                                        <tr>
                                            <td>
                                                <table cellspacing="0" cellpadding="0" width="94%" align="center">
                                                    <tr>
                                                        <td height="50"></td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <table cellspacing="0" cellpadding="0" width="95%" align="center">
                                                                <tr>
                                                                    <td style="font-family: 'Arial', sans-serif; font-size: 18px; line-height: 20px; color: #000; font-weight: 600">Welcome to Sewali charwali - 3 Card rumble game!,</td>
                                                                </tr>
                                                                <tr>
                                                                    <td height="15"></td>
                                                                </tr>
                                                                <tr>
                                                                    <td style="font-family: 'Lato', sans-serif; font-size: 15px; line-height: 20px; color: #000; font-weight: 600">Thank you for signing up! Now activate your account using below link!</td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td height="30px"></td>
                                                    </tr>
                                                    <tr>
                                                        <td><a href="<%= link %>" style="padding: 10px; text-decoration: none; display: block; background-color: #d12121; text-align: center; font-size: 16px; line-height: 20px; color: #fff; font-family: 'Arial'">Verify Your Account</a></td>
                                                    </tr>
                                                    <tr>
                                                        <td height="30px"></td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <table cellspacing="0" cellpadding="0" width="95%" align="center">
                                                                <tr>
                                                                    <td style="font-family: 'Lato', sans-serif; font-size: 15px; line-height: 20px; color: #000; font-weight: 600">Thanks,</td>
                                                                </tr>
                                                                <tr>
                                                                    <td style="font-family: 'Lato', sans-serif; font-size: 16px; line-height: 28px; color: #000; font-weight: 600">Sewali Charwali</td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td height="100"></td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </div>
                </td>
            </tr>
        </table>
    </body>
</html>
